
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translation Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 50px auto;
            padding: 28px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 30px;
        }

        .languages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
            margin-bottom: 18px;
        }

        .section {
            margin-top: 22px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .translate-btn {
            width: 100%;
            background: #4f46e5;
            color: white;
        }

        .translate-btn:hover {
            background: #3730a3;
        }

        .secondary-btn {
            background: #e2e8f0;
            color: #1e293b;
            margin: 5px 5px 0 0;
        }

        #status {
            margin-top: 15px;
            color: #475569;
            text-align: center;
        }

        @media (max-width: 550px) {
            .languages {
                grid-template-columns: 1fr;
            }

            .container {
                margin: 20px auto;
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Language Translation Tool</h1>
        <p class="subtitle">
            Translate text between different languages
        </p>

        <div class="languages">
            <div>
                <label for="source">Source Language</label>
                <select id="source">
                    <option value="en">English</option>
                    <option value="te">Telugu</option>
                    <option value="hi">Hindi</option>
                    <option value="kn">Kannada</option>
                    <option value="ta">Tamil</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                </select>
            </div>

            <div>
                <label for="target">Target Language</label>
                <select id="target">
                    <option value="te">Telugu</option>
                    <option value="en">English</option>
                    <option value="hi">Hindi</option>
                    <option value="kn">Kannada</option>
                    <option value="ta">Tamil</option>
                    <option value="fr">French</option>
                    <option value="es">Spanish</option>
                    <option value="de">German</option>
                </select>
            </div>
        </div>

        <div class="section">
            <label for="inputText">Enter Text</label>
            <textarea id="inputText"
                placeholder="Type the text you want to translate..."></textarea>
        </div>

        <button class="translate-btn" id="translateBtn"
            onclick="translateText()">Translate Text</button>

        <p id="status" role="status" aria-live="polite"></p>

        <div class="section">
            <label for="outputText">Translated Text</label>
            <textarea id="outputText" readonly
                placeholder="Your translation will appear here..."></textarea>

            <button class="secondary-btn" onclick="copyTranslation()">
                Copy Translation
            </button>

            <button class="secondary-btn" onclick="speakTranslation()">
                Listen
            </button>
        </div>
    </main>

    <script>
        async function translateText() {
            const text = document.getElementById("inputText").value.trim();
            const source = document.getElementById("source").value;
            const target = document.getElementById("target").value;
            const output = document.getElementById("outputText");
            const status = document.getElementById("status");
            const button = document.getElementById("translateBtn");

            if (!text) {
                status.textContent = "Please enter some text.";
                return;
            }

            if (source === target) {
                status.textContent =
                    "Please select two different languages.";
                return;
            }

            button.disabled = true;
            status.textContent = "Translating...";
            output.value = "";

            try {
                const params = new URLSearchParams({
                    q: text,
                    langpair: source + "|" + target
                });

                const response = await fetch(
                    "https://api.mymemory.translated.net/get?" +
                    params.toString()
                );

                if (!response.ok) {
                    throw new Error("Translation service unavailable.");
                }

                const data = await response.json();

                if (data.responseStatus !== 200 ||
                    !data.responseData?.translatedText) {
                    throw new Error("Could not translate this text.");
                }

                output.value = data.responseData.translatedText;
                status.textContent = "Translation completed!";
            } catch (error) {
                status.textContent =
                    "Translation failed. Check your internet connection " +
                    "or try again later.";
            } finally {
                button.disabled = false;
            }
        }

        async function copyTranslation() {
            const output = document.getElementById("outputText");
            const status = document.getElementById("status");

            if (!output.value) {
                status.textContent = "There is no translation to copy.";
                return;
            }

            try {
                await navigator.clipboard.writeText(output.value);
                status.textContent = "Translation copied!";
            } catch (error) {
                output.focus();
                output.select();
                status.textContent =
                    "Select the text and copy it manually.";
            }
        }

        function speakTranslation() {
            const text = document.getElementById("outputText").value;
            const language = document.getElementById("target").value;
            const status = document.getElementById("status");

            if (!text) {
                status.textContent = "Translate some text first.";
                return;
            }

            if (!("speechSynthesis" in window)) {
                status.textContent =
                    "Text-to-speech is not supported in this browser.";
                return;
            }

            window.speechSynthesis.cancel();

            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = {
                en: "en-US",
                te: "te-IN",
                hi: "hi-IN",
                kn: "kn-IN",
                ta: "ta-IN",
                fr: "fr-FR",
                es: "es-ES",
                de: "de-DE"
            }[language];

            window.speechSynthesis.speak(speech);
            status.textContent = "Playing audio if a suitable voice is available.";
        }
    </script>
</body>
</html>
